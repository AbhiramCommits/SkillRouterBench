name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Generate Data
      run: |
        PYTHONPATH=src python -m skillrouterbench.data.generate --out data/

    - name: Run Pytest with Coverage
      run: |
        PYTHONPATH=src pytest --cov=src --cov-report=xml -v
